  - id: python-0014
    type: free_text
    role: both
    difficulty: 10
    topic: python
    subtopic: large data on one machine
    tags: [out-of-core, duckdb, parquet, arrow, scaling]
    prompt: >-
      You must compute patient-level features from 500 GB of EHR event logs (CSV, one file per
      day) on a single 32 GB, 8-core workstation, and rerun it monthly. Design the approach,
      covering storage format, compute engine, correctness checks and when you would move to a
      cluster.
    est_minutes: 15
    model_answer: >-
      Storage: convert the CSVs once to Parquet (columnar and compressed, often 5-10× smaller)
      with explicit schemas. Partition by date, and possibly by a hash of patient ID, so queries
      can prune partitions and push predicates down. Keep the raw files immutable and make the
      conversion idempotent and incremental (only new days each month). Compute: use an
      out-of-core, multi-threaded engine rather than pandas in memory. DuckDB, or Polars' lazy
      or streaming mode, can scan Parquet, spill to disk, and run joins and aggregations with
      bounded memory. Express the features as SQL or lazy queries: windowed aggregates per
      patient, counts in lookback windows anchored to the prediction dates. Avoid exploding
      joins, materialize intermediate tables, and limit memory and thread settings. For logic
      that is truly per-patient, process hash-partitioned buckets of patients independently in
      parallel processes. Correctness: reconcile row counts between raw and converted data, and
      check uniqueness and null expectations. Compare the features for a sample of patients
      against an independent slow implementation (pandas on a subset). Enforce point-in-time
      correctness of the lookback windows, make runs deterministic, and version the outputs.
      Performance hygiene: read only the needed columns, use appropriate types (dictionary
      encoding, timestamps), sort or cluster by patient to help the joins, and benchmark on one
      month first. Move to a cluster (Spark, or distributed DuckDB/Polars alternatives) when the
      single machine cannot meet the time window, when the data grows beyond local disk, when
      many users need concurrent access, or when governance requires a managed platform. Do not
      move just because the data is larger than RAM: out-of-core engines handle that.
    rubric:
      - "Converts to partitioned Parquet with schemas and incremental, idempotent ingestion"
      - "Uses an out-of-core engine (DuckDB/Polars streaming) instead of in-memory pandas"
      - "Designs feature computation with windowed aggregates and avoids exploding joins; considers hash-partitioned parallelism"
      - "Includes correctness checks (reconciliation, sample cross-checks, point-in-time windows)"
      - "Gives sensible criteria for when to move to a cluster (not merely data > RAM)"
